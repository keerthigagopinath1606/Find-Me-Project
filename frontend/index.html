<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <!-- Anti-Cache -->
  <meta
    http-equiv="Cache-Control"
    content="no-cache, no-store, must-revalidate"
  />

  <meta
    http-equiv="Pragma"
    content="no-cache"
  />

  <meta
    http-equiv="Expires"
    content="0"
  />

  <!-- SEO -->
  <title>
    FINDME — National Missing Persons & Sighting Intelligence Platform | India
  </title>

  <meta
    name="description"
    content="FINDME is India's dedicated missing persons search, reporting, and AI facial recognition intelligence platform bridging public citizens with law enforcement agencies."
  />

  <meta
    name="theme-color"
    content="#0a192f"
  />

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="manifest" href="manifest.json" />
  <meta name="application-name" content="FIND-ME" />
  <meta name="keywords" content="missing persons, CCTV AI, face matching, emergency alert, investigation intelligence, FIND-ME" />
  <meta property="og:title" content="FIND-ME — Missing Persons & Investigation Intelligence Platform" />
  <meta property="og:description" content="AI-assisted missing-person investigation with explainable evidence, movement reconstruction and emergency alerts." />
  <meta property="og:type" content="website" />

  <!-- Google Fonts -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- Your actual CSS file -->
  <link
    rel="stylesheet"
    href="styles.css"
  />

</head>


<body>

  <!-- FINDME Application -->
  <div id="app"></div>


  <!-- Frontend JavaScript -->

  <script src="data.js"></script>

  <script src="face-engine.js"></script>

  <script src="store.js"></script>

  <script src="components.js"></script>

  <script src="api-bridge.js"></script>

  <script src="app.js"></script>

  <script src="backend-integration.js"></script>
  <script src="v11-intelligence.js"></script>

</body>

</html>
